<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Waylen Weather Service</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #fff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --shadow: 0 4px 16px rgba(15, 23, 42, .08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 .25rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin: 0 0 1.5rem;
            font-size: .9rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: .25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.25rem;
        }

        .tab {
            padding: .6rem 1rem;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: .95rem;
            color: var(--muted);
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        /* Form */
        .form-card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.25rem;
        }

        .form-row {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 140px;
        }

        label {
            font-size: .8rem;
            color: var(--muted);
            margin-bottom: .25rem;
        }

        input {
            padding: .55rem .75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: .95rem;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        .btn {
            padding: .55rem 1.5rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* Result */
        #result {
            display: none;
        }

        #result.visible {
            display: block;
        }

        .result-card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .result-header h2 {
            margin: 0;
            font-size: 1.4rem;
        }

        .result-header .country {
            color: var(--muted);
            font-size: .85rem;
            margin-left: .5rem;
        }

        .temp {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .condition {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin: .5rem 0 1rem;
            color: var(--muted);
        }

        .condition img {
            width: 48px;
            height: 48px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .75rem 1.5rem;
        }

        .grid .lbl {
            color: var(--muted);
            font-size: .8rem;
        }

        .grid .val {
            font-weight: 600;
            margin-left: .25rem;
        }

        /* Error */
        .error-card {
            background: var(--error-bg);
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: var(--error);
        }

        .error-card .code {
            font-weight: 600;
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--muted);
            font-size: .8rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .temp {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Waylen Weather Service</h1>
    <p class="subtitle">Look up the current weather by city, ZIP code, or coordinates</p>

    <div class="tabs">
        <button class="tab active" data-target="panel-city">By city</button>
        <button class="tab" data-target="panel-zip">By ZIP code</button>
        <button class="tab" data-target="panel-coord">By coordinates</button>
    </div>

    <div class="form-card">
        <form class="tab-panel active" id="panel-city" onsubmit="return query('city')">
            <div class="form-row">
                <div class="field">
                    <label for="city">City name</label>
                    <input id="city" placeholder="e.g. London or London,GB" required type="text">
                </div>
                <button class="btn" type="submit">Look up</button>
            </div>
        </form>

        <form class="tab-panel" id="panel-zip" onsubmit="return query('zip')">
            <div class="form-row">
                <div class="field">
                    <label for="zip">ZIP / postal code</label>
                    <input id="zip" placeholder="e.g. 10001" required type="text">
                </div>
                <div class="field">
                    <label for="country">Country code (ISO)</label>
                    <input id="country" maxlength="2" placeholder="US" required type="text">
                </div>
                <button class="btn" type="submit">Look up</button>
            </div>
        </form>

        <form class="tab-panel" id="panel-coord" onsubmit="return query('coord')">
            <div class="form-row">
                <div class="field">
                    <label for="lat">Latitude</label>
                    <input id="lat" max="90" min="-90" placeholder="-90 to 90" required step="any" type="number">
                </div>
                <div class="field">
                    <label for="lon">Longitude</label>
                    <input id="lon" max="180" min="-180" placeholder="-180 to 180" required step="any" type="number">
                </div>
                <button class="btn" type="submit">Look up</button>
            </div>
        </form>
    </div>

    <div id="result"></div>

    <div class="footer">
        Data: <a href="https://openweathermap.org" rel="noopener" target="_blank">OpenWeatherMap</a>
        &middot; <span id="serverTime"></span>
    </div>
</div>

<script>
    /* ---------- Tab switching ---------- */
    document.querySelectorAll('.tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.tab').forEach(function (t) {
                t.classList.remove('active');
            });
            document.querySelectorAll('.tab-panel').forEach(function (p) {
                p.classList.remove('active');
            });
            tab.classList.add('active');
            document.getElementById(tab.dataset.target).classList.add('active');
        });
    });

    /* ---------- Unified query dispatcher ---------- */
    function query(type) {
        event.preventDefault();
        var url;
        if (type === 'city') {
            var city = val('city');
            if (!city) return false;
            url = '/api/weather/city?city=' + enc(city);
        } else if (type === 'zip') {
            var zip = val('zip'), country = val('country');
            if (!zip || !country) return false;
            url = '/api/weather/zip?zip=' + enc(zip) + '&country=' + enc(country.toUpperCase());
        } else {
            var lat = val('lat'), lon = val('lon');
            if (lat === '' || lon === '') return false;
            url = '/api/weather/coordinates?lat=' + enc(lat) + '&lon=' + enc(lon);
        }
        fetchWeather(url);
        return false;
    }

    /* ---------- Fetch & render ---------- */
    async function fetchWeather(url) {
        var el = document.getElementById('result');
        el.className = 'visible';
        el.innerHTML = '<div class="form-card">Loading&hellip;</div>';
        try {
            var resp = await fetch(url, {headers: {Accept: 'application/json'}});
            var body = await resp.json();
            resp.ok ? renderWeather(body.data) : renderError(body, resp.status);
        } catch (err) {
            renderError({code: 'NETWORK_ERROR', message: err.message}, 0);
        }
    }

    function renderWeather(w) {
        var t = num(w.temperature), fl = num(w.feelsLike);
        var wind = w.wind && w.wind.speed != null ? w.wind.speed.toFixed(1) + ' m/s' : '\u2014';
        var icon = w.iconCode ? 'https://openweathermap.org/img/wn/' + w.iconCode + '@2x.png' : '';

        document.getElementById('result').innerHTML =
            '<div class="result-card">' +
            '<div class="result-header">' +
            '<div><h2>' + esc(w.locationName || 'Unknown') +
            '<span class="country">' + esc(w.country || '') + '</span></h2></div>' +
            '<div class="temp">' + t + '</div>' +
            '</div>' +
            '<div class="condition">' +
            (icon ? '<img src="' + icon + '" alt="">' : '') +
            '<span>' + esc(w.description || w.condition || '') + '</span>' +
            '</div>' +
            '<div class="grid">' +
            row('Feels like', fl) +
            row('Humidity', w.humidity != null ? w.humidity + '%' : '\u2014') +
            row('Pressure', w.pressure != null ? w.pressure + ' hPa' : '\u2014') +
            row('Wind', wind) +
            row('Cloudiness', w.cloudiness != null ? w.cloudiness + '%' : '\u2014') +
            row('Visibility', w.visibility != null ? w.visibility + ' m' : '\u2014') +
            '</div>' +
            '</div>';
    }

    function renderError(body, status) {
        document.getElementById('result').innerHTML =
            '<div class="error-card">' +
            '<div class="code">' + esc(body && body.code ? body.code : 'HTTP ' + status) + '</div>' +
            '<div>' + esc(body && body.message ? body.message : 'Request failed') + '</div>' +
            '</div>';
    }

    /* ---------- Helpers ---------- */
    function val(id) {
        return document.getElementById(id).value.trim();
    }

    function enc(s) {
        return encodeURIComponent(s);
    }

    function num(v) {
        return v != null ? v.toFixed(1) + '\u00b0' : '\u2014';
    }

    function row(label, value) {
        return '<div><span class="lbl">' + label + '</span><span class="val">' + value + '</span></div>';
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('serverTime').textContent = new Date().toLocaleString();
</script>
</body>
</html>
