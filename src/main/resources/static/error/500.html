<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>500 — Internal Server Error · Waylen Weather Service</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #fff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --error: #dc2626;
            --shadow: 0 4px 16px rgba(15, 23, 42, .08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            box-shadow: var(--shadow);
        }

        .code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            margin: 0 0 .5rem;
            color: var(--error);
            letter-spacing: -.05em;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 .5rem;
            font-weight: 600;
        }

        p {
            color: var(--muted);
            margin: 0 0 1.5rem;
            line-height: 1.55;
        }

        .actions {
            display: flex;
            gap: .75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: .6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: .95rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: background .15s, border-color .15s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }

        .btn-secondary:hover { background: #f9fafb; }

        footer {
            margin-top: 1.5rem;
            color: var(--muted);
            font-size: .8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="code">500</div>
            <h1>Internal Server Error</h1>
            <p>Something went wrong on our side. The team has been notified — please retry in a moment.</p>
            <div class="actions">
                <a href="/" class="btn btn-primary">Back to Home</a>
                <a href="/actuator/health" class="btn btn-secondary">Health Status</a>
            </div>
        </div>
        <footer>© 2026 Waylen Weather Service</footer>
    </div>
</body>
</html>
