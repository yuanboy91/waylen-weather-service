server.port=8099
spring.application.name=waylen-weather-service

# OpenWeatherMap API configuration.
# The API key is supplied via the OPENWEATHERMAP_API_KEY environment variable in
# production. The placeholder below is intentionally non-key-looking so GitHub's
# secret-scanner does not flag it; do not commit a real key here. For local dev,
# set the env var or replace the placeholder temporarily.
openweathermap.api.base-url=https://api.openweathermap.org/data/2.5
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:REPLACE_WITH_OPENWEATHERMAP_KEY}
openweathermap.api.units=metric
openweathermap.api.connect-timeout-ms=3000
openweathermap.api.read-timeout-ms=5000

# Weather response cache (Caffeine): entries older than TTL are evicted on next read.
# Default 10-minute freshness window is sufficient for current-weather queries; tighten
# if you need stricter freshness guarantees.
openweathermap.cache.ttl=10m
openweathermap.cache.maximum-size=500

# Spring Boot Actuator - exposes /actuator/health and /actuator/info for the deploy script.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Current weather lookup by city, ZIP code, or geographic coordinates


