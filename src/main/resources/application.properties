server.port=8099
server.address=0.0.0.0
spring.application.name=waylen-weather-service

# OpenWeatherMap API configuration.
openweathermap.api.base-url=https://api.openweathermap.org/data/2.5
openweathermap.api.key=
openweathermap.api.units=metric
openweathermap.api.connect-timeout-ms=3000
openweathermap.api.read-timeout-ms=5000

# Weather response cache (Caffeine)
openweathermap.cache.ttl=10m
openweathermap.cache.maximum-size=500

# Spring Boot Actuator - exposes /actuator/health for the deploy script.
management.endpoints.web.exposure.include=health

# Springdoc OpenAPI / Swagger UI - explicit default paths.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
